[package]
name = "pocket-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Qwen3.5 and Qwen3.8 inference server on hand-written CUDA kernels with continuous batching"
repository = "https://github.com/lxe/pocket-engine"
publish = false

[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "cublaslt", "cuda-13000", "dynamic-loading"] }
safetensors = "0.8.0"
memmap2 = "0.9.11"
half = "2.7.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
futures-util = "0.3"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["json", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
llguidance = "1.9.1"
toktrie_hf_tokenizers = "1.9.1"
rayon = "1.12.0"

[features]
default = []
# Compiles the kernels with nvcc. Without it the crate builds (for CPU CI) but
# cannot load a model.
cuda = []
# Compiles the same kernels with hipcc for AMD Instinct GPUs (ROCm) and runs
# them through HIP and hipBLAS (src/hip.rs).
rocm = []

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
